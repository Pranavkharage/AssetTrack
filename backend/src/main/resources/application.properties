spring.application.name=AssetTrack
server.port=${PORT:10000}

# Local defaults: edit these values for local MySQL if you are not using environment variables.
# Render environment variables override these defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assettrack?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Replace the local placeholder with a random secret of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS_LONG}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Set these locally to create the first ADMIN, or use Render environment variables.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
