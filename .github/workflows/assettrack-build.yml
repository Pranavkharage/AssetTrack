name: AssetTrack build and package

on:
  push:
    branches: [AssetTrack-Structured]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Spring Boot backend
        working-directory: backend
        run: mvn -B -Dmaven.wagon.http.retryHandler.count=5 clean package -DskipTests

      - name: Assemble source archive with AssetTrack root folder
        run: |
          mkdir -p /tmp/assettrack-package/AssetTrack
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='target' ./ /tmp/assettrack-package/AssetTrack/
          cd /tmp/assettrack-package
          zip -qr "$GITHUB_WORKSPACE/AssetTrack.zip" AssetTrack

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AssetTrack-source
          path: AssetTrack.zip
          retention-days: 7

      - name: Build production Docker image
        run: docker build -t assettrack:ci .
